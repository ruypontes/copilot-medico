name: Testes do Backend

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  pytest:
    name: "pytest (API)"
    runs-on: ubuntu-latest

    # PostgreSQL 16 (o mesmo do compose) para tests/test_migracoes.py aplicar
    # a migracao tambem em Postgres (B19). Sem TEST_POSTGRES_URL esses casos
    # sao pulados, e a suite continua rodando so em SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copmed
          POSTGRES_PASSWORD: copmed
          POSTGRES_DB: copmed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copmed -d copmed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://copmed:copmed@localhost:5432/copmed_test

    defaults:
      run:
        working-directory: ./API

    steps:
      - name: "1. Baixar o código do repositório"
        uses: actions/checkout@v4

      - name: "2. Configurar Python 3.11"
        # 3.11 espelha a imagem do Dockerfile. O modulo audioop, usado pela
        # diarizacao, foi removido na 3.13.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: API/requirements-dev.txt

      - name: "3. Instalar dependências de teste"
        # Apenas o subconjunto leve: o conftest stuba vosk/spaCy/numpy, entao
        # o CI nao baixa os modelos Vosk nem compila dependencias nativas.
        run: pip install -r requirements-dev.txt

      - name: "4. Lint (ruff)"
        # Regras E9 + F (ver API/ruff.toml): erros de sintaxe, nomes
        # indefinidos e imports nao usados.
        run: ruff check .

      - name: "4b. Teste de vazamento de PII (bloqueante, B47/B60)"
        # Bloqueante: se qualquer PII plantada nos 20 casos sinteticos
        # aparecer no payload que SERIA enviado ao Gemini, o CI falha
        # antes da suite completa. B47: /soap e /api/chat; B60: audio
        # transcrito e PDF, ponta a ponta, e o log do servidor. US016-CA003.
        run: pytest tests/test_b47_vazamento_pii.py tests/test_b60_vazamento_completo.py -v -m leak

      - name: "5. Rodar a suíte de testes com cobertura"
        run: pytest tests/ -v --cov=backend --cov=server --cov=models --cov=repositories --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: "6. Resumo da cobertura"
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"### Cobertura do backend: {rate:.1%}")
          PY
          fi

      - name: "7. Publicar relatório de cobertura"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            API/coverage.xml
            API/htmlcov/
          if-no-files-found: ignore

  verificar-script-de-modelos:
    name: "Verificar script de download dos modelos (B13)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./API

    steps:
      - name: "1. Baixar o código do repositório"
        uses: actions/checkout@v4

      - name: "2. Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "3. Garantir que os modelos NÃO estão versionados"
        # O clone precisa ficar leve: se alguem recommitar os modelos, o job
        # falha aqui em vez de a regressao passar despercebida.
        run: |
          if git ls-files | grep -q 'vosk-model'; then
            echo "ERRO: arquivos de modelo Vosk voltaram para o versionamento."
            git ls-files | grep 'vosk-model'
            exit 1
          fi
          echo "OK: nenhum modelo Vosk versionado."

      - name: "4. Validar o script de download"
        # --check nao baixa nada (exit 1 por falta dos modelos e o esperado);
        # o objetivo e garantir que o script continua executavel e sem erro
        # de sintaxe/import.
        run: |
          python scripts/download_models.py --check && status=0 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "ERRO: --check deveria sair com 1 quando faltam modelos (saiu $status)."
            exit 1
          fi
          echo "OK: script de download responde corretamente."
