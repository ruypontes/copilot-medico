# Alembic (B19 / ADR-02). Rode a partir da pasta API/:
#
#   alembic upgrade head                      # aplica as migracoes no DB_URL
#   alembic revision --autogenerate -m "..."  # nova migracao a partir dos modelos
#   alembic check                             # falha se modelos e migracoes divergem
#
# A URL do banco NAO fica aqui: o migrations/env.py le DB_URL do ambiente /
# API/.env (backend/config.py). Para apontar a outro banco numa execucao:
#   alembic -x db_url=sqlite:///outro.db upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
